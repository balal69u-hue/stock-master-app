<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Stock Pro Tracker - TAS Master Alternative</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">
    
    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-white shadow-lg shadow-blue-500/20">AS</div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">StockTracker Pro</h1>
                    <p class="text-[10px] text-slate-400">Adobe Stock Live Asset & Contributor Intelligence</p>
                </div>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20 font-medium">● Real Adobe API Connected</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <!-- Search & Filter Controls -->
        <div class="max-w-3xl mx-auto mb-10">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-extrabold tracking-tight mb-2">Track Adobe Stock Downloads & Tags</h2>
                <p class="text-slate-400 text-xs">Search top assets by Keyword or track a Contributor's best-selling portfolio</p>
            </div>

            <!-- Search Mode Switcher -->
            <div class="flex justify-center mb-4 gap-2">
                <button id="btnKeyword" onclick="setMode('keyword')" class="px-5 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition">Search by Keyword</button>
                <button id="btnContributor" onclick="setMode('contributor')" class="px-5 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition">Track Contributor ID</button>
            </div>

            <!-- Input Box -->
            <div class="flex gap-2 bg-slate-900 p-2 rounded-2xl border border-slate-800 shadow-2xl">
                <input id="searchInput" type="text" placeholder="e.g. laptop icon, business concept, 209584321" 
                    class="w-full px-4 py-3 bg-transparent focus:outline-none text-white placeholder-slate-500 text-sm"
                    onkeypress="if(event.key === 'Enter') trackData()">
                <button onclick="trackData()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-xl font-bold text-sm transition shadow-lg shadow-blue-600/30 whitespace-nowrap">
                    Track Assets
                </button>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden text-center py-16">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-700 border-t-blue-500 mb-3"></div>
            <p class="text-slate-400 text-xs">Connecting to Adobe Stock live metrics...</p>
        </div>

        <!-- Results Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        let currentMode = "keyword";

        function setMode(mode) {
            currentMode = mode;
            const btnK = document.getElementById("btnKeyword");
            const btnC = document.getElementById("btnContributor");
            const input = document.getElementById("searchInput");

            if (mode === "keyword") {
                btnK.className = "px-5 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition";
                btnC.className = "px-5 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                input.placeholder = "Enter Keyword (e.g. laptop icon, Ramadan banner)...";
            } else {
                btnC.className = "px-5 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition";
                btnK.className = "px-5 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                input.placeholder = "Enter Contributor ID or Name (e.g. 209584321)...";
            }
        }

        async function trackData() {
            const query = document.getElementById("searchInput").value.trim();
            if(!query) return alert("Please enter a search query or ID!");

            const grid = document.getElementById("resultsGrid");
            const loader = document.getElementById("loader");
            
            grid.innerHTML = "";
            loader.classList.remove("hidden");

            try {
                const res = await fetch(`/api/track?query=${encodeURIComponent(query)}&search_type=${currentMode}`);
                const data = await res.json();
                loader.classList.add("hidden");

                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12 text-sm">No assets found on Adobe Stock for "${query}".</div>`;
                    return;
                }

                data.results.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "bg-slate-900/90 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition flex flex-col justify-between group";
                    card.innerHTML = `
                        <div class="h-48 bg-slate-950 overflow-hidden relative">
                            <a href="${item.asset_url}" target="_blank">
                                <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            </a>
                            <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur text-[11px] font-bold text-amber-400 px-2.5 py-1 rounded-md border border-amber-500/30">
                                ⚡ ${item.downloads} Downloads
                            </span>
                            <span class="absolute bottom-2 left-2 bg-slate-950/80 backdrop-blur text-[10px] text-slate-300 px-2 py-0.5 rounded border border-slate-800">
                                By: ${item.creator}
                            </span>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-grow">
                            <p class="text-xs text-slate-200 font-medium line-clamp-2 mb-3 leading-relaxed" title="${item.title}">${item.title}</p>
                            
                            <div class="bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/60 mb-3 text-[11px] text-slate-400 line-clamp-2 font-mono" title="${item.tags}">
                                ${item.tags}
                            </div>

                            <div class="grid grid-cols-2 gap-2 mt-auto">
                                <button onclick="copyText('${item.title.replace(/'/g, "\\'")}', this, 'Title Copied!')" 
                                    class="w-full text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg font-semibold transition border border-slate-700">
                                    Copy Title
                                </button>
                                <button onclick="copyText('${item.tags.replace(/'/g, "\\'")}', this, 'Tags Copied!')" 
                                    class="w-full text-[11px] bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 py-2 rounded-lg font-semibold transition border border-blue-500/30">
                                    Copy Tags
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                loader.classList.add("hidden");
                alert("Server connecting... Please wait a few seconds and try again.");
            }
        }

        function copyText(text, btn, msg) {
            navigator.clipboard.writeText(text);
            const original = btn.innerText;
            btn.innerText = "✓ " + msg;
            btn.classList.add("bg-emerald-600", "text-white");
            setTimeout(() => {
                btn.innerText = original;
                btn.classList.remove("bg-emerald-600", "text-white");
            }, 1800);
        }
    </script>
</body>
</html>
