<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAS Master - Portfolio Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { background-color: #fee2e2; color: #dc2626; }
        .active-sort { background-color: #dc2626 !important; color: white !important; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen font-sans">

    <!-- Top Navbar -->
    <header class="bg-white border-b border-slate-200 px-8 py-3 sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-8">
                <div class="flex items-center space-x-2 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-black text-white text-base shadow-sm">M</div>
                    <span class="font-bold text-lg text-slate-900 tracking-tight">TAS Master</span>
                </div>

                <nav class="flex items-center space-x-1 text-sm font-medium">
                    <button onclick="switchSearchType('keyword')" id="navKeyword" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">Keyword Search</button>
                    <button onclick="switchSearchType('contributor')" id="navPortfolio" class="px-4 py-1.5 rounded-lg active-tab font-semibold transition">Portfolio Tracker</button>
                    <span class="px-4 py-1.5 text-slate-400">Market Analysis</span>
                    <span class="px-4 py-1.5 text-slate-400">Topic Finder</span>
                </nav>
            </div>

            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-slate-700 text-white flex items-center justify-center font-bold text-xs">M</div>
                <span class="text-sm font-medium text-slate-700">Md Balal Uddin</span>
            </div>
        </div>
    </header>

    <!-- Search Section -->
    <main class="max-w-[1600px] mx-auto px-8 py-6">
        
        <div class="flex gap-2 max-w-full mx-auto mb-4">
            <div class="relative flex-grow">
                <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input id="searchInput" type="text" value="212986526" placeholder="Enter Contributor ID (e.g. 212986526)..."
                    class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-red-500 shadow-sm"
                    onkeypress="if(event.key === 'Enter') fetchData()">
            </div>
            <button onclick="fetchData()" class="bg-[#e11d48] hover:bg-red-700 text-white px-8 py-3.5 rounded-xl font-bold text-sm transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-magnifying-glass text-xs"></i> Track
            </button>
        </div>

        <!-- Filter Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 py-2 border-b border-slate-200 mb-6 text-xs">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-slate-500 font-medium mr-1">Sort:</span>
                <button onclick="setSort('relevance', this)" class="sort-btn px-3 py-1.5 rounded-md active-sort font-semibold">Relevance</button>
                <button onclick="setSort('downloads', this)" class="sort-btn px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium">Most Downloaded</button>
            </div>
            <div class="text-slate-500 text-xs font-semibold" id="resultInfo">
                <span id="itemsCount" class="font-bold text-slate-900">0 items</span> — Contributor <span id="contributorIdText" class="font-bold text-slate-900">212986526</span>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-red-600 mb-3"></div>
            <p class="text-slate-500 text-xs font-medium">Fetching live contributor portfolio & downloads...</p>
        </div>

        <!-- Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        let currentType = "contributor";
        let currentSort = "relevance";

        function switchSearchType(type) {
            currentType = type;
            const navK = document.getElementById("navKeyword");
            const navP = document.getElementById("navPortfolio");
            const input = document.getElementById("searchInput");

            if (type === "keyword") {
                navK.className = "px-4 py-1.5 rounded-lg active-tab font-semibold transition";
                navP.className = "px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
                input.placeholder = "Enter Keyword...";
            } else {
                navP.className = "px-4 py-1.5 rounded-lg active-tab font-semibold transition";
                navK.className = "px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
                input.placeholder = "Enter Contributor ID (e.g. 212986526)...";
            }
            fetchData();
        }

        function setSort(sort, btn) {
            currentSort = sort;
            document.querySelectorAll(".sort-btn").forEach(b => {
                b.className = "sort-btn px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium";
            });
            btn.className = "sort-btn px-3 py-1.5 rounded-md active-sort font-semibold";
            fetchData();
        }

        async function fetchData() {
            const query = document.getElementById("searchInput").value.trim();
            if(!query) return alert("Please enter an ID or Keyword!");

            const grid = document.getElementById("resultsGrid");
            const loader = document.getElementById("loader");
            const itemsCount = document.getElementById("itemsCount");
            const contributorIdText = document.getElementById("contributorIdText");

            grid.innerHTML = "";
            loader.classList.remove("hidden");
            contributorIdText.innerText = query;

            try {
                const res = await fetch(`/api/track?query=${encodeURIComponent(query)}&search_type=${currentType}&sort_by=${currentSort}`);
                const data = await res.json();
                loader.classList.add("hidden");

                itemsCount.innerText = `${data.results.length} items`;

                if(data.results.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-16 text-xs">No assets found for this contributor ID.</div>`;
                    return;
                }

                data.results.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="h-52 bg-slate-900/5 p-3 flex items-center justify-center relative group">
                                <a href="${item.url}" target="_blank" class="w-full h-full flex items-center justify-center">
                                    <img src="${item.thumbnail}" alt="${item.title}" class="max-h-full max-w-full object-contain">
                                </a>
                            </div>

                            <div class="p-4">
                                <div class="flex items-start justify-between gap-2 mb-3">
                                    <p class="text-xs text-slate-800 font-semibold line-clamp-2 leading-relaxed" title="${item.title}">${item.title}</p>
                                    <button onclick="copySingle('${item.title.replace(/'/g, "\\'")}', this)" class="text-slate-400 hover:text-slate-600 text-xs" title="Copy Title">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </div>

                                <div class="grid grid-cols-2 gap-2 mb-3">
                                    <div class="bg-[#2563eb] text-white p-2 rounded-lg text-left">
                                        <div class="text-base font-black leading-none mb-0.5">${item.downloads}</div>
                                        <div class="text-[9px] uppercase font-bold tracking-wider opacity-90">Downloads</div>
                                    </div>
                                    <div class="bg-[#10b981] text-white p-2 rounded-lg text-left">
                                        <div class="text-xs font-bold leading-tight mb-0.5">${item.time_ago}</div>
                                        <div class="text-[9px] uppercase font-bold tracking-wider opacity-90">Upload</div>
                                    </div>
                                </div>

                                <div class="flex items-center gap-1.5 text-[11px] text-slate-500 mb-3 flex-wrap">
                                    <span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200/60 font-medium">
                                        <i class="fa-solid fa-tag text-[9px] mr-1"></i> ${item.category}
                                    </span>
                                    <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">
                                        <i class="fa-regular fa-calendar text-[9px] mr-1"></i> ${item.date_formatted}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-[11px]">
                            <span class="text-slate-400">Keywords</span>
                            <button onclick="copySingle('${item.tags.replace(/'/g, "\\'")}', this)" class="text-slate-600 hover:text-red-600 font-medium flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy all
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                loader.classList.add("hidden");
                alert("Tracking timeout. Please retry.");
            }
        }

        function copySingle(text, btn) {
            navigator.clipboard.writeText(text);
            const orig = btn.innerHTML;
            btn.innerHTML = `<span class="text-emerald-600 font-bold">✓ Copied!</span>`;
            setTimeout(() => { btn.innerHTML = orig; }, 1500);
        }

        window.onload = () => { fetchData(); };
    </script>
</body>
</html>
